# Refresh the staging/development database (Supabase Mumbai) with a copy of production (Supabase Singapore).
# Runs scripts/refresh_staging_db.py --yes: production is only read; staging's data is completely replaced.
#
# Schedule (GitHub cron is UTC; IST = UTC+05:30, and GitHub may start a scheduled run a few minutes late):
#   Every day 06:00 IST = 00:30 UTC (before the shift starts, so staging has yesterday's production data)
# Also runnable by hand: GitHub -> Actions -> "Refresh staging database" -> Run workflow.
#
# Repository secrets (Settings -> Secrets and variables -> Actions), copied from the local env files:
#   PRODUCTION_DATABASE_URL  - PRODUCTION_DATABASE_URL from .env.production.local (session pooler, port 5432)
#   STAGING_DATABASE_URL     - DATABASE_URL from .env.local                       (session pooler, port 5432)
# The script refuses to run if both point at the same Supabase project, and never prints credentials.

name: Refresh staging database

on:
  schedule:
    - cron: "30 0 * * *"   # every day 06:00 IST
  workflow_dispatch:

concurrency:
  group: refresh-staging-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install Python requirements
        run: pip install -r requirements.txt

      # pg_dump must be at least the server's major version (Supabase runs Postgres 17).
      - name: Install PostgreSQL 17 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Write the env files the script reads
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          # Name exactly which secret the run cannot see (never its value). Environment secrets,
          # Codespaces / Dependabot secrets and repository *variables* are not visible here.
          missing=""
          [ -z "$PRODUCTION_DATABASE_URL" ] && missing="$missing PRODUCTION_DATABASE_URL"
          [ -z "$STAGING_DATABASE_URL" ] && missing="$missing STAGING_DATABASE_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty repository secret(s):$missing. Add them under Settings -> Secrets and variables -> Actions -> Secrets tab -> Repository secrets."
            exit 1
          fi
          # Forgive common paste mistakes: surrounding spaces / newlines, quotes, and a copied
          # "NAME=" prefix from the .env file. Only what was fixed is printed, never the value.
          clean() {
            local name="$1" v="${!1}" fixed=""
            local t; t="$(printf '%s' "$v" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ "$t" != "$v" ] && fixed="$fixed spaces/newlines"; v="$t"
            if [[ "$v" =~ ^(export[[:space:]]+)?[A-Za-z_]+[[:space:]]*= ]]; then
              v="${v#*=}"; v="${v#"${v%%[![:space:]]*}"}"; fixed="$fixed NAME=-prefix"
            fi
            t="${v%\"}"; t="${t#\"}"; t="${t%\'}"; t="${t#\'}"
            [ "$t" != "$v" ] && fixed="$fixed quotes"; v="$t"
            [ -n "$fixed" ] && echo "::warning::$name: removed$fixed from the pasted value."
            case "$v" in
              postgres://*|postgresql://*) ;;
              *) echo "::error::$name is not a database address: it should be one line starting with postgresql://"; return 1 ;;
            esac
            printf -v "$name" '%s' "$v"
          }
          clean PRODUCTION_DATABASE_URL || exit 1
          clean STAGING_DATABASE_URL || exit 1
          umask 077
          printf 'PRODUCTION_DATABASE_URL=%s\n' "$PRODUCTION_DATABASE_URL" > .env.production.local
          printf 'DATABASE_URL=%s\nAPP_ENV=staging\n' "$STAGING_DATABASE_URL" > .env.local

      - name: Refresh staging from production
        shell: bash
        run: |
          # Also publish the script's last lines as a run annotation, so the result can be read
          # (e.g. by Claude via the API) without opening the log. The script never prints credentials.
          set +e
          python scripts/refresh_staging_db.py --yes 2>&1 | tee refresh.log
          status=${PIPESTATUS[0]}
          set -e
          summary="$(tail -n 30 refresh.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          if [ "$status" -eq 0 ]; then
            echo "::notice title=Staging refresh result::${summary}"
          else
            echo "::error title=Staging refresh failed (exit ${status})::${summary}"
          fi
          rm -f refresh.log
          exit "$status"

      - name: Remove the env files
        if: always()
        run: rm -f .env.local .env.production.local
